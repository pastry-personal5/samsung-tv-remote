[package]
name = "samsung-tv-remote"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
iced = { version = "0.14", features = ["advanced", "canvas", "image", "tokio"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "time", "sync", "rt-multi-thread", "macros", "io-util", "signal"] }
tokio-native-tls = "0.3"
tokio-tungstenite = "0.30"
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
url = "2"
security-framework = "3.7"
core-foundation = "0.10"
security-framework-sys = "2.17"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
subtle = "2"
hmac = "0.12.1"
getrandom = "0.4"

[dev-dependencies]
iced_runtime = "0.14"
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
